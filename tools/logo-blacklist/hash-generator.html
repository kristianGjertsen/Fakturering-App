<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logo hash-generator</title>
    <style>
      body { font: 16px system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; color: #172033; }
      input { display: block; margin: 20px 0; }
      li { margin: 10px 0; }
      code { padding: 3px 6px; border-radius: 4px; background: #f1f5f9; }
    </style>
  </head>
  <body>
    <h1>Logo hash-generator</h1>
    <p>
      Velg bilder fra <code>reference-images</code>. Kopier hashene til
      <code>blockedLogoHashes</code> i <code>src/lib/logoBlacklist.ts</code>.
    </p>
    <input id="images" type="file" accept="image/*" multiple />
    <ul id="results"></ul>

    <script>
      const input = document.querySelector("#images");
      const results = document.querySelector("#results");

      input.addEventListener("change", async () => {
        results.replaceChildren();

        for (const file of input.files) {
          const image = await loadImage(file);
          const hash = calculateLogoHash(image);
          const item = document.createElement("li");
          const code = document.createElement("code");
          code.textContent = `"${hash}", // ${file.name}`;
          item.append(code);
          results.append(item);
          URL.revokeObjectURL(image.src);
        }
      });

      function loadImage(file) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = reject;
          image.src = URL.createObjectURL(file);
        });
      }

      function calculateLogoHash(image) {
        const width = 9;
        const height = 8;
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext("2d", { willReadFrequently: true });

        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, width, height);
        context.drawImage(image, 0, 0, width, height);

        const pixels = context.getImageData(0, 0, width, height).data;
        let hash = 0n;

        for (let y = 0; y < height; y += 1) {
          for (let x = 0; x < width - 1; x += 1) {
            const left = (y * width + x) * 4;
            const right = left + 4;
            const leftBrightness = brightness(pixels, left);
            const rightBrightness = brightness(pixels, right);
            hash = (hash << 1n) | (leftBrightness > rightBrightness ? 1n : 0n);
          }
        }

        return hash.toString(16).padStart(16, "0");
      }

      function brightness(pixels, index) {
        return pixels[index] * 0.299
          + pixels[index + 1] * 0.587
          + pixels[index + 2] * 0.114;
      }
    </script>
  </body>
</html>
